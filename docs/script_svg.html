<svg id="mySVG" width="500" height="300" xmlns="http://www.w3.org/2000/svg">
  <line id="line" x1="0" y1="0" x2="0" y2="0" stroke="black" stroke-width="2" />
</svg>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
  var svg = document.getElementById('mySVG');
  var line = document.getElementById('line');
  var clickCount = 0;
  var startPoint, endPoint;

  $('#mySVG').on('click', function(event) {
    var svgPoint = getSvgPoint(event);

    if (clickCount === 0) {
      startPoint = svgPoint;
      clickCount++;
    } else if (clickCount === 1) {
      endPoint = svgPoint;

      // Imposta i punti del segmento
      line.setAttribute('x1', startPoint.x);
      line.setAttribute('y1', startPoint.y);
      line.setAttribute('x2', endPoint.x);
      line.setAttribute('y2', endPoint.y);

      clickCount = 0;
    }
  });

  // Funzione per ottenere le coordinate corrette all'interno dell'SVG
  function getSvgPoint(event) {
    var point = svg.createSVGPoint();
    point.x = event.clientX;
    point.y = event.clientY;
    return point.matrixTransform(svg.getScreenCTM().inverse());
  }
});
</script>
